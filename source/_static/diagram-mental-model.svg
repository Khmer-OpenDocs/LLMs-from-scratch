<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Noto Sans Khmer','Khmer OS','Noto Serif Khmer',sans-serif">
  <rect width="880" height="470" rx="12" fill="#12151d"/>
  <text x="440" y="34" text-anchor="middle" font-size="16" fill="#eef2f7" font-weight="600">គំរូគំនិត (Mental Model) — បំពង់ការងារសាងសង់ LLM ពីមូលដ្ឋាន</text>

  <!-- Row 1 -->
  <g font-size="13" text-anchor="middle">
    <rect x="24" y="60" width="152" height="76" rx="10" fill="#1d2c3d" stroke="#3d7ec2"/>
    <text x="100" y="90" fill="#d8dee9">ទិន្នន័យអត្ថបទ</text>
    <text x="100" y="112" fill="#9aa4b2" font-size="11">Text Data</text>
    <text x="100" y="152" fill="#6ab0f3" font-size="11">ជំពូក ២</text>

    <rect x="200" y="60" width="152" height="76" rx="10" fill="#1d2c3d" stroke="#3d7ec2"/>
    <text x="276" y="90" fill="#d8dee9">Tokenizer → Tokens</text>
    <text x="276" y="112" fill="#9aa4b2" font-size="11">BPE · tiktoken</text>
    <text x="276" y="152" fill="#6ab0f3" font-size="11">ជំពូក ២</text>

    <rect x="376" y="60" width="152" height="76" rx="10" fill="#1d2c3d" stroke="#3d7ec2"/>
    <text x="452" y="90" fill="#d8dee9">Embeddings</text>
    <text x="452" y="112" fill="#9aa4b2" font-size="11">វ៉ិចទ័រតំណាង token</text>
    <text x="452" y="152" fill="#6ab0f3" font-size="11">ជំពូក ២</text>

    <rect x="552" y="60" width="152" height="76" rx="10" fill="#1d2c3d" stroke="#3d7ec2"/>
    <text x="628" y="90" fill="#d8dee9">Attention</text>
    <text x="628" y="112" fill="#9aa4b2" font-size="11">Multi-Head Attention</text>
    <text x="628" y="152" fill="#6ab0f3" font-size="11">ជំពូក ៣</text>

    <rect x="728" y="60" width="128" height="76" rx="10" fill="#1d3a2e" stroke="#3dc283"/>
    <text x="792" y="90" fill="#d8dee9">ម៉ូដែល GPT</text>
    <text x="792" y="112" fill="#9aa4b2" font-size="11">GPT Model</text>
    <text x="792" y="152" fill="#6ab0f3" font-size="11">ជំពូក ៤</text>
  </g>

  <!-- Row 1 arrows -->
  <g stroke="#4cc38a" stroke-width="2.5" fill="#4cc38a">
    <line x1="176" y1="98" x2="192" y2="98"/><polygon points="192,93 202,98 192,103"/>
    <line x1="352" y1="98" x2="368" y2="98"/><polygon points="368,93 378,98 368,103"/>
    <line x1="528" y1="98" x2="544" y2="98"/><polygon points="544,93 554,98 544,103"/>
    <line x1="704" y1="98" x2="720" y2="98"/><polygon points="720,93 730,98 720,103"/>
  </g>

  <!-- Down arrow from GPT to Pretraining -->
  <g stroke="#4cc38a" stroke-width="2.5" fill="#4cc38a">
    <line x1="792" y1="136" x2="792" y2="222"/><polygon points="787,222 792,232 797,222"/>
  </g>

  <!-- Row 2 -->
  <g font-size="13" text-anchor="middle">
    <rect x="700" y="236" width="156" height="76" rx="10" fill="#3a2e1d" stroke="#b08232"/>
    <text x="778" y="266" fill="#d8dee9">Pretraining</text>
    <text x="778" y="288" fill="#9aa4b2" font-size="11">លើទិន្នន័យគ្មានស្លាក</text>
    <text x="778" y="328" fill="#6ab0f3" font-size="11">ជំពូក ៥</text>

    <rect x="452" y="200" width="176" height="66" rx="10" fill="#2a1d3a" stroke="#9c6ade"/>
    <text x="540" y="226" fill="#d8dee9">Finetuning ចំណាត់ថ្នាក់</text>
    <text x="540" y="248" fill="#9aa4b2" font-size="11">Text Classification · ជំពូក ៦</text>

    <rect x="452" y="286" width="176" height="66" rx="10" fill="#2a1d3a" stroke="#9c6ade"/>
    <text x="540" y="312" fill="#d8dee9">Finetuning ការណែនាំ</text>
    <text x="540" y="334" fill="#9aa4b2" font-size="11">Instructions · ជំពូក ៧</text>

    <rect x="200" y="236" width="176" height="76" rx="10" fill="#1d2c3d" stroke="#4cc38a" stroke-width="2"/>
    <text x="288" y="266" fill="#d8dee9">ជំនួយការ LLM</text>
    <text x="288" y="288" fill="#9aa4b2" font-size="11">LLM Assistant / UI</text>
    <text x="288" y="328" fill="#6ab0f3" font-size="11">streamlit UI ក្នុងថត 06_user_interface</text>
  </g>

  <!-- Row 2 arrows (right to left) -->
  <g stroke="#4cc38a" stroke-width="2.5" fill="#4cc38a">
    <path d="M 700 262 Q 668 240 638 234" fill="none"/><polygon points="640,228 630,232 638,240"/>
    <path d="M 700 288 Q 668 310 638 316" fill="none"/><polygon points="638,310 630,318 640,322"/>
    <line x1="452" y1="233" x2="400" y2="258" /><polygon points="404,250 394,261 406,264"/>
    <line x1="452" y1="319" x2="400" y2="292"/><polygon points="406,286 394,289 404,300"/>
  </g>

  <!-- Foundation bar -->
  <rect x="24" y="380" width="832" height="42" rx="10" fill="#1f2430" stroke="#2c3444"/>
  <text x="440" y="406" text-anchor="middle" font-size="12.5" fill="#9aa4b2">មូលដ្ឋានគ្រឹះ៖ ជំពូក ១ — ស្វែងយល់ពី Large Language Models (គ្មានកូដ) · PyTorch (ភាគបន្ថែម A)</text>
  <text x="440" y="450" text-anchor="middle" font-size="11" fill="#5c6773">ដ្យាក្រាមដើមរចនាឡើងសម្រាប់ឯកសារសហគមន៍នេះ — ផ្អែកលើរចនាសម្ព័ន្ធជំពូកពិតរបស់ឃ្លាំង upstream</text>
</svg>
